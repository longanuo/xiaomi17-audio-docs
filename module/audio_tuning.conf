# 小米17（pudding）类哈曼音质音效配置。

# 原 pudding 模块使用的原厂 Dolby 音乐档。
ENABLE_DOLBY_MUSIC=1
DOLBY_PROFILE=3

# MiSound 音乐状态；不携带小米10S的库或硬件资源。
ENABLE_MISOUND_MUSIC=1

# 音量连续性由模块内原机 Dolby 调音文件中的过渡档负责，
# 无需额外写入空间声总开关。
ENABLE_SPATIAL_ANCHOR=0

# 不修改任何 mixer 控制项：保留 WSA 数字音量=原厂值、扬声器保护和原厂限幅。
# 请勿把 10S/其他机型的 IIR、WSA 或 ACDB 值直接套用到本机。
